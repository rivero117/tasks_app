<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひとつずつタスク</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eeeeee;--text:#111;--sub:#6f6f6f;--panel:#fff;--field:#e4e4e4;--lime:#ff5a00;--pink:#0f6fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--text:#f5f5f0;--sub:#8c8c86;--panel:#1c1c1c;--field:#2a2a2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--text:#f5f5f0;--sub:#8c8c86;--panel:#1c1c1c;--field:#2a2a2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Helvetica Neue","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;font-weight:700;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:48px;font-weight:900;letter-spacing:-.03em;margin:6px 0 0;line-height:1}
.dot{color:var(--pink)}.sub{color:var(--sub);font-size:14px;margin:8px 0 14px}
.bar{height:10px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--lime);transition:width .3s}
.stat{font-size:12px;color:var(--sub);margin-bottom:14px}
.add{display:flex;gap:8px;margin-bottom:10px}
input,select,textarea{font:inherit;font-weight:600;color:var(--text);background:var(--field);border:0;border-radius:18px;padding:12px 14px;width:100%}
.add input{font-size:17px;font-weight:700;padding:14px 20px;border-radius:99px;background:transparent;border:2px solid var(--text)}
.btn{padding:0 22px;border:0;border-radius:99px;background:var(--lime);color:#0c0c0c;font-size:16px;font-weight:900;white-space:nowrap}
#detail{display:grid;gap:10px;background:var(--panel);border-radius:28px;padding:14px;margin-bottom:14px}
#detail label{font-size:12px;color:var(--sub);display:grid;gap:4px}
#detail label.ck{display:flex;align-items:center;gap:8px;color:var(--text)}
.ck input{width:20px;height:20px;padding:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghost{border:0;background:var(--field);color:var(--sub);border-radius:99px;padding:9px;font-size:13px;font-weight:700}
.alert{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--lime);color:#0c0c0c;border-radius:24px;padding:12px 16px;margin-bottom:8px;font-size:15px}
.alert b{flex:1 1 100%;word-break:break-word;font-weight:900}
.alert button{border:0;background:#0c0c0c;color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.tile{border:0;border-radius:22px;background:var(--panel);color:var(--text);padding:10px 10px;text-align:left;font-size:12px;font-weight:800}
.tile b{display:block;font-size:26px;line-height:1.1}
.tile.on{background:var(--text);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px}
.chip{white-space:nowrap;border:0;border-radius:99px;padding:6px 12px;background:var(--panel);color:var(--sub);font-size:13px;font-weight:800}
.chip.on{background:var(--lime);color:#0c0c0c}
.note{font-size:12px;color:var(--sub);margin:0 0 10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:flex-start;gap:12px;border-radius:30px;padding:16px 12px 16px 18px;color:#0c0c0c}
.t{font-size:22px;font-weight:800;line-height:1.25;word-break:break-word}
li.done .t{text-decoration:line-through;text-decoration-thickness:3px}
.chk{width:28px;height:28px;border-radius:50%;border:3px solid var(--fg,#0c0c0c);background:transparent;flex:none;color:var(--bgc,#fff);font-size:15px;line-height:1;padding:0;margin-top:2px}
li.done .chk{background:var(--fg,#0c0c0c)}
.body{flex:1;min-width:0}
.meta{font-size:13px;opacity:.8;margin-top:2px}
.meta.late{font-weight:900;opacity:1;text-decoration:underline}
.memo{font-size:13px;opacity:.8;white-space:pre-wrap;word-break:break-word;margin-top:2px;font-weight:600}
.tg{display:inline-block;font-size:11px;font-weight:900;border-radius:99px;padding:0 8px;border:2px solid currentColor;margin:4px 4px 0 0}
.tg.hi{background:var(--fg);color:var(--bgc);border-color:var(--fg)}
.ic{border:0;background:transparent;font-size:20px;color:inherit;padding:2px 4px}
.empty{text-align:center;color:var(--sub);padding:28px 0;font-size:14px}
.msg{color:var(--pink);font-size:13px;min-height:18px;margin:0 0 6px}
.hab{background:var(--panel);border-radius:28px;padding:14px 16px;margin-top:20px}
.hab h2{font-size:18px;margin:0 0 4px;font-weight:900}
.hrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--field)}
.hrow .chk{border-color:var(--lime);color:#0c0c0c;margin:0}
.hrow.done .chk{background:var(--lime)}
.hn{font-size:17px;font-weight:800;word-break:break-word}
.hs{font-size:12px;color:var(--sub)}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{display:grid;justify-items:center;gap:2px;font-style:normal;font-size:9px;color:var(--sub)}
.dots u{display:block;width:16px;height:16px;border-radius:5px;background:var(--field)}
.dots u.on{background:var(--lime)}
.hrow .ic{color:var(--sub)}
</style>
</head>
<body>
<main>
  <h1>TODAY<span class="dot">•</span></h1>
  <p class="sub" id="dt"></p>
  <div class="bar"><i id="bar"></i></div>
  <div class="stat" id="stat"></div>
  <div id="alerts"></div>
  <div class="add">
    <input id="in" placeholder="何をやる?(Enterで追加)" autocomplete="off">
    <button class="btn" id="addBtn">追加</button>
  </div>
  <div id="detail">
    <div class="row2">
      <label>いつ<input type="datetime-local" id="due"></label>
      <label>リマインド<select id="rem">
        <option value="">なし</option><option value="0">時刻ちょうど</option>
        <option value="10" selected>10分前</option><option value="60">1時間前</option><option value="1440">1日前</option>
      </select></label>
    </div>
    <div class="row2">
      <label>優先度<select id="pri"><option value="3">高</option><option value="2" selected>中</option><option value="1">低</option></select></label>
      <label>タグ<input id="tag" list="tags" placeholder="例: 仕事"><datalist id="tags"></datalist></label>
    </div>
    <label>メモ<textarea id="memo" rows="2" placeholder="補足、URL、最初の一歩など"></textarea></label>
    <label class="ck"><input type="checkbox" id="nag">完了するまで10分おきに再通知</label>
    <label class="ck"><input type="checkbox" id="hab">毎日くりかえす習慣にする(時刻だけ使います)</label>
    <button class="ghost" id="cancel">クリア</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="tiles" id="tiles"></div>
  <div class="chips" id="chips"></div>
  <p class="note" id="note"></p>
  <ul id="list"></ul>
  <section class="hab"><h2 id="habT">Habit</h2><div id="habs"></div></section>
  <button class="ghost" id="perm" hidden style="margin-top:14px">🔔 ブラウザ通知を許可する</button>
</main>
<script>
var KEY="onetask_v2",OLD="onetask_v1",MAX=3,view="now",tagF="",editId=null,alerts=[],tasks=[],habits=[];
var ZN=["now","next","someday"],ZI={now:"🔥",next:"🌅",someday:"🌙"},PAL=[["#8fe3e8","#1f3d8f"],["#0e7a3f","#f2b632"],["#ffb3c1","#e8294f"],["#0b2f87","#ffc0cb"],["#f8b62d","#fff7e6"],["#ff5a00","#111111"],["#0f6fff","#ffffff"]];
var REML={"0":"ちょうど","10":"10分前","60":"1時間前","1440":"1日前"};
try{var d0=JSON.parse(localStorage.getItem(KEY)||"null");if(d0){tasks=d0.tasks||[];habits=d0.habits||[]}else{tasks=JSON.parse(localStorage.getItem(OLD)||"[]")}}catch(e){}
tasks.forEach(function(t){
  if(!t.zone)t.zone=t.today?"now":"next";if(t.pri===undefined)t.pri=2;if(t.tag===undefined)t.tag="";
  if(t.next===undefined)t.next=(t.due&&t.rem!==""&&t.rem!==undefined&&!t.notified)?new Date(t.due).getTime()-Number(t.rem)*60000:null;
});
function save(){try{localStorage.setItem(KEY,JSON.stringify({tasks:tasks,habits:habits}))}catch(e){}}
function $(i){return document.getElementById(i)}
function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function find(id){return tasks.find(function(x){return x.id===id})}
function ds(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fmt(s){var d=new Date(s);return (d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function nowCount(){return tasks.filter(function(t){return t.zone==="now"&&!t.done}).length}
function flash(s){$("msg").textContent=s;setTimeout(function(){$("msg").textContent=""},2500)}
function streak(x){var n=0,d=new Date();if(x.days.indexOf(ds(d))<0)d.setDate(d.getDate()-1);while(x.days.indexOf(ds(d))>=0){n++;d.setDate(d.getDate()-1)}return n}
function hashTag(s){var n=0;for(var i=0;i<s.length;i++)n=(n*31+s.charCodeAt(i))%1000;return n}
function resetForm(){
  editId=null;["in","due","memo","tag"].forEach(function(i){$(i).value=""});
  $("rem").value="10";$("pri").value="2";$("nag").checked=false;$("hab").checked=false;$("hab").disabled=false;$("addBtn").textContent="追加";
}
function submit(){
  var v=$("in").value.trim();if(!v)return;
  var due=$("due").value,rem=due?$("rem").value:"",memo=$("memo").value.trim(),tag=$("tag").value.trim().replace(/^#/,""),pri=Number($("pri").value),nag=$("nag").checked;
  if($("hab").checked&&!editId){
    habits.push({id:Date.now(),text:v,memo:memo,tag:tag,time:due?due.slice(11,16):"",days:[],fired:""});
  }else{
    var nx=(due&&rem!=="")?new Date(due).getTime()-Number(rem)*60000:null;
    if(editId){var t=find(editId);t.text=v;t.memo=memo;t.due=due;t.rem=rem;t.tag=tag;t.pri=pri;t.nag=nag;t.next=nx}
    else{
      var z=(view==="now"&&nowCount()<MAX)?"now":"next";
      tasks.unshift({id:Date.now(),text:v,memo:memo,due:due,rem:rem,tag:tag,pri:pri,nag:nag,next:nx,zone:z,done:false});
    }
  }
  resetForm();save();render();check();
}
function edit(id){
  var t=find(id);resetForm();editId=id;
  $("in").value=t.text;$("due").value=t.due||"";$("memo").value=t.memo||"";$("tag").value=t.tag||"";
  $("rem").value=t.rem===undefined||t.rem===""?(t.due?"":"10"):t.rem;$("pri").value=t.pri;$("nag").checked=!!t.nag;
  $("hab").disabled=true;$("addBtn").textContent="保存";$("in").focus();
}
function cycle(id){
  var t=find(id),i=ZN.indexOf(t.zone),nz=ZN[(i+1)%3];
  if(nz==="now"&&nowCount()>=MAX){nz=ZN[(i+2)%3];flash("Nowは"+MAX+"つまで。どれかを終えるか動かしてね")}
  t.zone=nz;save();render();
}
function toggleDone(id){var t=find(id);t.done=!t.done;if(t.done)t.next=null;save();render();renderAlerts()}
function toggleHabit(id){
  var x=habits.find(function(a){return a.id===id}),k=ds(),i=x.days.indexOf(k);
  if(i<0)x.days.push(k);else x.days.splice(i,1);save();render();renderAlerts();
}
function del(id){tasks=tasks.filter(function(x){return x.id!==id});alerts=alerts.filter(function(a){return a!=="t:"+id});save();render();renderAlerts()}
function delHabit(id){habits=habits.filter(function(x){return x.id!==id});alerts=alerts.filter(function(a){return a!=="h:"+id});save();render();renderAlerts()}
function notify(txt){
  try{if(window.Notification&&Notification.permission==="granted")new Notification("リマインド",{body:txt})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(200)}catch(e){}
}
function addAlert(k,txt){if(alerts.indexOf(k)<0)alerts.push(k);notify(txt)}
function check(){
  var now=Date.now(),hit=false,k=ds(),n=new Date(),hm=("0"+n.getHours()).slice(-2)+":"+("0"+n.getMinutes()).slice(-2);
  tasks.forEach(function(t){
    if(t.done||!t.next||now<t.next)return;
    t.next=t.nag?now+600000:null;addAlert("t:"+t.id,t.text);hit=true;
  });
  habits.forEach(function(x){
    if(!x.time||x.fired===k||x.days.indexOf(k)>=0||hm<x.time)return;
    x.fired=k;addAlert("h:"+x.id,x.text);hit=true;
  });
  if(hit){save();renderAlerts();render()}
}
function renderAlerts(){
  var box=$("alerts");box.innerHTML="";var k=ds();
  alerts=alerts.filter(function(a){
    var id=Number(a.slice(2));
    if(a[0]==="t"){var t=find(id);return t&&!t.done}
    var x=habits.find(function(q){return q.id===id});return x&&x.days.indexOf(k)<0;
  });
  alerts.forEach(function(a){
    var id=Number(a.slice(2)),isT=a[0]==="t",o=isT?find(id):habits.find(function(q){return q.id===id});
    var d=h("div","alert");d.appendChild(h("b","","🔔 "+o.text+(isT&&o.due?"("+fmt(o.due)+")":"")));
    var dn=h("button","","完了");dn.onclick=function(){isT?toggleDone(id):toggleHabit(id)};d.appendChild(dn);
    if(isT){var sn=h("button","","10分後");sn.onclick=function(){o.next=Date.now()+600000;alerts=alerts.filter(function(z){return z!==a});save();renderAlerts()};d.appendChild(sn)}
    var ok=h("button","","了解");ok.onclick=function(){alerts=alerts.filter(function(z){return z!==a});renderAlerts()};d.appendChild(ok);
    box.appendChild(d);
  });
  document.title=(alerts.length?"🔔 ":"")+"ひとつずつタスク";
}
function render(){
  var doneN=tasks.filter(function(t){return t.done}).length,tot=tasks.length;
  $("bar").style.width=(tot?doneN/tot*100:0)+"%";
  $("stat").textContent=tot?("完了 "+doneN+" / "+tot):"まだタスクはありません";
  var tl=$("tiles");tl.innerHTML="";
  [["now","🔥 Now"],["next","🌅 Next"],["someday","🌙 Someday"],["done","✓ 完了"]].forEach(function(z){
    var n=z[0]==="done"?doneN:tasks.filter(function(t){return !t.done&&t.zone===z[0]}).length;
    var b=h("button","tile"+(view===z[0]?" on":""));b.appendChild(h("span","",z[1]));b.appendChild(h("b","",String(n)));
    b.onclick=function(){view=z[0];render()};tl.appendChild(b);
  });
  var tags=[];tasks.forEach(function(t){if(t.tag&&tags.indexOf(t.tag)<0)tags.push(t.tag)});
  if(tags.indexOf(tagF)<0)tagF="";
  var cp=$("chips");cp.innerHTML="";
  if(tags.length)[""].concat(tags).forEach(function(g){
    var c=h("button","chip"+(tagF===g?" on":""),g?"#"+g:"すべて");c.onclick=function(){tagF=g;render()};cp.appendChild(c);
  });
  $("tags").innerHTML="";tags.forEach(function(g){var o=document.createElement("option");o.value=g;$("tags").appendChild(o)});
  var list=tasks.filter(function(t){
    if(tagF&&t.tag!==tagF)return false;
    return view==="done"?t.done:(!t.done&&t.zone===view);
  });
  list.sort(function(a,b){
    if(a.pri!==b.pri)return b.pri-a.pri;
    if(a.due&&b.due)return a.due<b.due?-1:1;
    return a.due?-1:b.due?1:0;
  });
  $("note").textContent=view==="now"?"Nowは最大"+MAX+"つ(いま "+nowCount()+"/"+MAX+")。優先度の高い順に並びます":
    view==="done"?"お疲れさま。消したいときは×で":"右の絵文字をタップすると Now → Next → Someday と移動します";
  var ul=$("list");ul.innerHTML="";
  if(!list.length)ul.appendChild(h("div","empty",view==="done"?"まだ完了はありません":"ここは空っぽ。気楽にいこう"));
  list.forEach(function(t,i){
    var li=h("li",t.done?"done":""),pc=t.tag?PAL[hashTag(t.tag)%7]:PAL[i%7];li.style.background=pc[0];li.style.color=pc[1];li.style.setProperty("--bgc",pc[0]);li.style.setProperty("--fg",pc[1]);
    var c=h("button","chk",t.done?"✓":"");c.setAttribute("aria-label","完了切替");c.onclick=function(){toggleDone(t.id)};
    var bd=h("div","body");bd.appendChild(h("div","t",t.text));
    if(t.due){
      var late=!t.done&&new Date(t.due).getTime()<Date.now();
      bd.appendChild(h("div","meta"+(late?" late":""),(late?"期限切れ ":"")+"📅 "+fmt(t.due)+(t.rem?"  🔔 "+REML[t.rem]:"")+(t.nag?" 🔁":"")));
    }
    if(t.pri===3)bd.appendChild(h("span","tg hi","優先:高"));
    if(t.pri===1)bd.appendChild(h("span","tg","低"));
    if(t.tag)bd.appendChild(h("span","tg","#"+t.tag));
    if(t.memo)bd.appendChild(h("div","memo",t.memo));
    li.appendChild(c);li.appendChild(bd);
    if(!t.done){
      var z=h("button","ic",ZI[t.zone]);z.setAttribute("aria-label","移動");z.onclick=function(){cycle(t.id)};li.appendChild(z);
      var ed=h("button","ic","✎");ed.setAttribute("aria-label","編集");ed.onclick=function(){edit(t.id)};li.appendChild(ed);
    }
    var x=h("button","ic","×");x.setAttribute("aria-label","削除");x.onclick=function(){del(t.id)};li.appendChild(x);
    ul.appendChild(li);
  });
  $("habT").textContent="🔁 Habit  "+habits.length;
  var hb=$("habs");hb.innerHTML="";var k=ds();
  if(!habits.length)hb.appendChild(h("div","hs","「毎日くりかえす習慣にする」にチェックして追加すると、ここに並びます"));
  habits.forEach(function(x){
    var dn=x.days.indexOf(k)>=0,r=h("div","hrow"+(dn?" done":""));
    var c=h("button","chk",dn?"✓":"");c.onclick=function(){toggleHabit(x.id)};
    var bd=h("div","body");bd.appendChild(h("div","hn",x.text));
    var s=streak(x);
    bd.appendChild(h("div","hs",(s>0?"🔥 "+s+"日連続":x.days.length?"また今日から":"今日からスタート")+(x.time?"  ・毎日 "+x.time:"")+(x.tag?"  #"+x.tag:"")));
    var ds7=h("div","dots");
    for(var i=6;i>=0;i--){
      var dd=new Date();dd.setDate(dd.getDate()-i);
      var cell=h("i","");cell.appendChild(h("u",x.days.indexOf(ds(dd))>=0?"on":""));cell.appendChild(document.createTextNode("日月火水木金土"[dd.getDay()]));ds7.appendChild(cell);
    }
    bd.appendChild(ds7);
    var xb=h("button","ic","×");xb.setAttribute("aria-label","削除");xb.onclick=function(){delHabit(x.id)};
    r.appendChild(c);r.appendChild(bd);r.appendChild(xb);hb.appendChild(r);
  });
}
$("addBtn").onclick=submit;$("cancel").onclick=resetForm;
$("in").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.isComposing)submit()});
try{if(window.Notification&&Notification.permission==="default")$("perm").hidden=false}catch(e){}
$("perm").onclick=function(){try{Notification.requestPermission().then(function(){$("perm").hidden=true})}catch(e){$("perm").hidden=true}};
setInterval(check,15000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)check()});
var dd0=new Date();$("dt").textContent=(dd0.getMonth()+1)+"月"+dd0.getDate()+"日 "+"日月火水木金土"[dd0.getDay()]+"曜日";
render();renderAlerts();check();
</script>
</body>
</html>
